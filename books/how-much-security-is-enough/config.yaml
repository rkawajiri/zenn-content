title: "セキュリティ、どこまでやれば十分？ ― 3 分チェックから SCS ★3、最初の 90 日まで"
summary: "専任チームのない会社で、最初にセキュリティを任された人のための本です。役員に「うちは大丈夫？」と聞かれても、「どこまでやれば十分か」の基準がなければ答えられません。経産省・IPA のガイドラインと SCS 評価制度、AWS のセキュリティ成熟度モデルをもとに、自社の現在地を Lv0〜Lv4 で測り、自社にとっての目標レベルを決め、次の一手と最終形を描きます。社内 IT、AWS、GitHub、AI 時代のリスク、夜間・休日の見張り、インシデント対応、最初の 90 日のロードマップまで扱います。3 分でできる簡易チェック付き（2026 年 11 月時点）。"
