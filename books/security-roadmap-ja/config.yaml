title: "セキュリティ、どこまでやれば十分？ ― 一人目の担当者のための現在地・次の一手・最終形（AWS・GitHub・AI）"
summary: "「うちのセキュリティ、大丈夫？」と聞かれて答えに詰まったことはありませんか。セキュリティ専任チームのない会社で、最初にセキュリティを任された人のためのテキストです。経産省・IPA のガイドライン（サイバーセキュリティ経営ガイドライン、中小企業の情報セキュリティ対策ガイドライン、SCS 評価制度）と AWS セキュリティ成熟度モデルを物差しに、自社の現在地を Lv0〜Lv4 で測り、次の一手と最終形を描きます。AWS（Security Hub / GuardDuty）、SATv2、Wiz、GitHub、Takumi byGMO、Claude Security の役割分担と、AI 時代の新しいリスクへの備えもまとめます。3 分でできる簡易チェック付き（2026 年 11 月時点の情報）。"
