title: "セキュリティ、どこまでやれば十分？ ― ランサムウェアと AI の時代に、一人目の担当者が描く現在地・次の一手・最終形"
summary: "アサヒ・アスクルのランサムウェア被害、2026 年 10 月に相次いだ GMO インターネットや国内クラウドへの攻撃と大規模な情報漏えい、攻撃者による AI の利用、Claude Mythos による脆弱性の大量発見、能動的サイバー防御法の施行。2025〜2026 年、セキュリティは経営の話題になりました。「うちは大丈夫？」と聞かれて答えに詰まった、専任チームのない会社の一人目のセキュリティ担当者のためのテキストです。経産省・IPA のガイドライン（サイバーセキュリティ経営ガイドライン、中小企業の情報セキュリティ対策ガイドライン、SCS 評価制度）と AWS セキュリティ成熟度モデルを物差しに、現在地を Lv0〜Lv4 で測り、次の一手と最終形を描きます。AWS（Security Hub / GuardDuty）、SATv2、Wiz、GitHub、Takumi byGMO、Claude Security の役割分担と、AI 時代のリスクへの備えもまとめます。3 分でできる簡易チェック付き（2026 年 11 月時点）。"
